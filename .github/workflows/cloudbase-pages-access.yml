name: Repair GitHub Pages access

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/cloudbase-pages-access.yml

permissions:
  contents: read

concurrency:
  group: cloudbase-pages-access
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TCB_ENV_ID: art-supabase-staging-d8a9e32316e
      TENCENTCLOUD_SECRETID: ${{ secrets.TCB_SECRET_ID }}
      TENCENTCLOUD_SECRETKEY: ${{ secrets.TCB_SECRET_KEY }}
      PAGES_ORIGIN: https://art-si.github.io
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check deployment credentials
        run: |
          if [ -z "$TENCENTCLOUD_SECRETID" ] || [ -z "$TENCENTCLOUD_SECRETKEY" ]; then
            echo '::error::The existing TCB_SECRET_ID and TCB_SECRET_KEY repository secrets are required.'
            exit 1
          fi
      - name: Install CloudBase CLI
        run: npm install --global @cloudbase/cli@3.8.9
      - name: Preserve current domains and add the GitHub Pages origin
        run: |
          set -euo pipefail
          mkdir -p evidence
          request=$(jq -nc --arg env "$TCB_ENV_ID" '{EnvId: $env}')
          tcb --json api tcb DescribeAuthDomains --body "$request" | sed -n '/^{/,$p' > evidence/domains-before.json
          jq -e '.data.Domains | type == "array"' evidence/domains-before.json > /dev/null
          if jq -e '.data.Domains | any(.Domain == "art-si.github.io" and .Status == "ENABLE")' evidence/domains-before.json > /dev/null; then
            echo 'GitHub Pages domain is already enabled.'
          else
            request=$(jq -nc --arg env "$TCB_ENV_ID" '{EnvId: $env, Domains: ["art-si.github.io"]}')
            tcb --json api tcb CreateAuthDomain --body "$request"
          fi
          request=$(jq -nc --arg env "$TCB_ENV_ID" '{EnvId: $env}')
          tcb --json api tcb DescribeAuthDomains --body "$request" | sed -n '/^{/,$p' > evidence/domains-after.json
          jq -e '.data.Domains | any(.Domain == "art-si.github.io" and .Status == "ENABLE")' evidence/domains-after.json > /dev/null
      - name: Verify browser preflights after propagation
        run: |
          set -euo pipefail
          gateway="https://$TCB_ENV_ID.api.tcloudbasegateway.com"
          for attempt in $(seq 1 20); do
            status=$(curl -sS -D evidence/rest-headers.txt -o /dev/null -w '%{http_code}' -X OPTIONS "$gateway/v1/rdb/rest/sys_param" \
              -H "Origin: $PAGES_ORIGIN" -H 'Access-Control-Request-Method: GET' \
              -H 'Access-Control-Request-Headers: apikey,authorization,x-client-info,accept-profile')
            if [ "$status" = 204 ] && grep -qi "^access-control-allow-origin: $PAGES_ORIGIN" evidence/rest-headers.txt; then
              break
            fi
            if [ "$attempt" = 20 ]; then
              echo "::error::GitHub Pages database preflight still returns $status."
              exit 1
            fi
            sleep 10
          done
          curl --fail-with-body -sS -D evidence/auth-headers.txt -o /dev/null -X OPTIONS "$gateway/auth/v1/token" \
            -H "Origin: $PAGES_ORIGIN" -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: apikey,authorization,x-client-info,content-type'
          grep -qi "^access-control-allow-origin: $PAGES_ORIGIN" evidence/auth-headers.txt
          echo 'GitHub Pages database and authentication preflights passed.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudbase-pages-access
          path: evidence/
          retention-days: 7
